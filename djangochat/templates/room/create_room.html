{% extends "base.html" %}
{% block content %}
  <h2>Create a New Chat Room</h2>
  <form method="post">
    {% csrf_token %}
    <div style="margin-bottom:12px;">
      <label for="id_name">Room Name</label><br/>
      <input type="text"
             name="name"
             id="id_name"
             required
             style="padding:8px; width:100%; max-width:400px;"/>
    </div>
    <button type="submit"
            style="padding:10px 20px; background:orange; color:white; border:none; border-radius:4px;">
      Create Room
    </button>
  </form>
{% endblock %}
