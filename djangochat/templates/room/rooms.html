{% extends "base.html" %}
{% load static %}

{% block title %}Rooms | Travel Buddy{% endblock %}

{% block content %}
  <div style="width:100%; padding:40px 20px; text-align:center;">
    <h1 style="font-size:2.5rem; color:black; margin:0;">Chat Rooms</h1>
  </div>

  <div style="display:flex; justify-content:center; flex-wrap:nowrap; padding:16px; gap:12px; overflow-x:auto;">
    {% for room in rooms %}
      <form action="{% url 'room' room.slug %}" method="get" style="margin:0;">
        <button type="submit"
                style="padding:12px 24px; background:orange; color:white; border:none; border-radius:8px; cursor:pointer; transition:background 0.2s;">
          {{ room.name }}
        </button>
      </form>
    {% endfor %}
  </div>
{% endblock %}
