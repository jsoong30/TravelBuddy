{% extends "base.html" %}

{% block title %}
  {% if itinerary %}
    Edit Itinerary
  {% else %}
    Create Itinerary
  {% endif %}
{% endblock %}

{% block content %}
<style>
  .itinerary-container {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    margin-top: 1.5rem;
  }
  .form-section {
    flex: 1;
    min-width: 320px;
    max-width: 500px;
    padding: 20px;
    border-radius: 8px;
    background-color: #f9f9f9;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
  }
  .form-section h3 {
    margin-top: 0;
    font-size: 1.5rem;
    color: #333;
  }
  .map-section {
    flex: 2;
    min-width: 400px;
  }
  #location-input, #visit-date, #visit-notes {
    width: 100%;
    margin-bottom: 10px;
    padding: 8px;
    border-radius: 5px;
    border: 1px solid #ccc;
  }
  .location-input-container {
    background-color: #eef4fb;
    padding: 20px;
    border-radius: 8px;
    margin-bottom: 20px;
  }
  .itinerary-detail-container {
    background-color: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    margin-top: 20px;
  }
  #location-list {
    list-style: none;
    padding: 0;
    margin: 0;
  }
  #location-list li {
    margin-bottom: 12px;
    padding: 8px;
    border-bottom: 1px solid #ddd;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: background-color 0.3s ease;
    flex-wrap: wrap;
  }
  #location-list li.editing {
    background-color: #f0f8ff;
    border-left: 4px solid #4682b4;
  }
  .scroll-box {
    max-height: 300px;
    overflow-y: auto;
    border: 1px solid #ccc;
    padding: 0.5rem;
    border-radius: 5px;
    background-color: #fafafa;
  }
  #map {
    width: 100%;
    height: 500px;
    border-radius: 6px;
  }
  .btn-edit {
    margin-left: 8px;
    color: blue;
    cursor: pointer;
  }
  .btn-remove {
    color: red;
    cursor: pointer;
  }
</style>

<h2>{% if itinerary %}Edit{% else %}Create{% endif %} an Itinerary</h2>

<div class="itinerary-container">
  <div class="form-section">
    <form method="POST" id="itinerary-form">
      {% csrf_token %}
      <input type="text" name="title" placeholder="Trip Title" required style="width: 100%; margin-bottom: 10px;" value="{{ itinerary.name|default_if_none:'' }}"><br>
      <label>Start Date:</label>
      <input type="date" name="start_date" required style="width: 100%; margin-bottom: 10px;" value="{{ itinerary.start_date|date:'Y-m-d' }}"><br>
      <label>End Date:</label>
      <input type="date" name="end_date" required style="width: 100%; margin-bottom: 10px;" value="{{ itinerary.end_date|date:'Y-m-d' }}"><br>

      <div class="location-input-container">
        <label>Search Location:</label>
        <input id="location-input" type="text" placeholder="Search location..."><br>
        <label>Visit Date:</label>
        <input id="visit-date" type="date"><br>
        <label>Notes:</label>
        <input id="visit-notes" type="text" placeholder="Notes..."><br>
        <button type="button" onclick="confirmLocation()">Add Location</button>
      </div>

      <button type="submit">{% if itinerary %}Update{% else %}Save{% endif %} Itinerary</button>
      <input type="hidden" name="locations_json" id="locations-json">
    </form>
  </div>

  <div class="map-section">
    <div id="map"></div>
  </div>
</div>

<div class="itinerary-detail-container">
  <h3>Itinerary Details</h3>
  <div class="scroll-box">
    <ul id="location-list"></ul>
  </div>
</div>

<script src="https://maps.googleapis.com/maps/api/js?key={{ GOOGLE_MAPS_API_KEY }}&libraries=places"></script>

<script>
let map, autocomplete, selectedPlace = null, locations = {{ itinerary.locations|default:"[]"|safe }}, markers = [], searchMarker = null, editingIndex = null;

function initMap() {
  map = new google.maps.Map(document.getElementById('map'), {
    center: { lat: 37.7749, lng: -122.4194 },
    zoom: 8,
  });
  autocomplete = new google.maps.places.Autocomplete(document.getElementById('location-input'));
  autocomplete.addListener('place_changed', () => {
    const place = autocomplete.getPlace();
    if (!place.geometry) return;
    selectedPlace = {
      name: place.name,
      address: place.formatted_address,
      latitude: place.geometry.location.lat(),
      longitude: place.geometry.location.lng(),
      visit_date: new Date().toISOString().split('T')[0],
      notes: "",
      order: locations.length + 1
    };
    map.setCenter(place.geometry.location);
    map.setZoom(14);
    if (searchMarker) searchMarker.setMap(null);
    searchMarker = new google.maps.Marker({
      map: map,
      position: place.geometry.location,
      label: "Selected",
      title: "Selected Location"
    });
  });
  if (locations.length > 0) {
    renderLocationList();
    locations.forEach(loc => {
      const marker = new google.maps.Marker({
        map: map,
        position: { lat: loc.latitude, lng: loc.longitude },
        label: `${loc.order}`,
        title: loc.name
      });
      markers.push(marker);
    });
    fitMapToMarkers();
  }
}

function fitMapToMarkers() {
  if (locations.length > 1) {
    const bounds = new google.maps.LatLngBounds();
    locations.forEach(loc => bounds.extend({ lat: loc.latitude, lng: loc.longitude }));
    map.fitBounds(bounds);
  } else if (locations.length === 1) {
    map.setCenter({ lat: locations[0].latitude, lng: locations[0].longitude });
    map.setZoom(12);
  }
}

function confirmLocation() {
  if (!selectedPlace) {
    alert("Please select a location first.");
    return;
  }
  const selectedDate = document.getElementById('visit-date').value;
  const notes = document.getElementById('visit-notes').value;
  const startDate = document.querySelector('[name="start_date"]').value;
  const endDate = document.querySelector('[name="end_date"]').value;
  if (!selectedDate) {
    alert("Please choose a visit date.");
    return;
  }
  if (startDate && endDate && (selectedDate < startDate || selectedDate > endDate)) {
    alert("Visit date must be within the trip start and end dates.");
    return;
  }
  if (editingIndex === null) {
    selectedPlace.visit_date = selectedDate;
    selectedPlace.notes = notes;
    locations.push(selectedPlace);
  } else {
    locations[editingIndex].visit_date = selectedDate;
    locations[editingIndex].notes = notes;
    locations[editingIndex].name = selectedPlace.name;
    locations[editingIndex].address = selectedPlace.address;
    locations[editingIndex].latitude = selectedPlace.latitude;
    locations[editingIndex].longitude = selectedPlace.longitude;
    markers[editingIndex].setMap(null);
    markers[editingIndex] = new google.maps.Marker({
      map: map,
      position: { lat: selectedPlace.latitude, lng: selectedPlace.longitude },
      label: `${locations[editingIndex].order}`,
      title: selectedPlace.name
    });
    editingIndex = null;
  }
  locations.sort((a, b) => new Date(a.visit_date) - new Date(b.visit_date));
  locations.forEach((loc, i) => loc.order = i + 1);
  clearMarkers();
  locations.forEach(loc => {
    const marker = new google.maps.Marker({
      map: map,
      position: { lat: loc.latitude, lng: loc.longitude },
      label: `${loc.order}`,
      title: loc.name
    });
    markers.push(marker);
  });
  if (searchMarker) {
    searchMarker.setMap(null);
    searchMarker = null;
  }
  renderLocationList();
  document.getElementById('locations-json').value = JSON.stringify(locations);
  selectedPlace = null;
  document.getElementById('location-input').value = '';
  document.getElementById('visit-date').value = '';
  document.getElementById('visit-notes').value = '';
}

function clearMarkers() {
  markers.forEach(marker => marker.setMap(null));
  markers = [];
}

function renderLocationList() {
  const list = document.getElementById('location-list');
  list.innerHTML = '';
  locations.forEach((loc, idx) => {
    const li = document.createElement('li');
    li.classList.remove('editing');
    if (editingIndex === idx) li.classList.add('editing');
    li.innerHTML = `<strong>${idx + 1}. ${loc.name}</strong><br>${loc.address}<br><em>${loc.visit_date}</em><br>Notes: ${loc.notes}
    <span class="btn-edit" onclick="editLocation(${idx})">Edit</span>
    <span class="btn-remove" onclick="removeLocation(${idx})">Remove</span>`;
    list.appendChild(li);
  });
}

function editLocation(index) {
  const loc = locations[index];
  editingIndex = index;
  document.getElementById('location-input').value = loc.name;
  document.getElementById('visit-date').value = loc.visit_date;
  document.getElementById('visit-notes').value = loc.notes;
  map.setCenter({ lat: loc.latitude, lng: loc.longitude });
  map.setZoom(14);
  if (searchMarker) searchMarker.setMap(null);
  searchMarker = new google.maps.Marker({
    map: map,
    position: { lat: loc.latitude, lng: loc.longitude },
    label: "Editing",
    title: "Editing Location"
  });
  const list = document.getElementById('location-list');
  list.querySelectorAll('li').forEach((li, idx) => {
    li.classList.remove('editing');
    if (idx === index) li.classList.add('editing');
  });
}

function removeLocation(index) {
  locations.splice(index, 1);
  markers[index].setMap(null);
  markers.splice(index, 1);
  locations.forEach((loc, i) => loc.order = i + 1);
  clearMarkers();
  locations.forEach(loc => {
    const marker = new google.maps.Marker({
      map: map,
      position: { lat: loc.latitude, lng: loc.longitude },
      label: `${loc.order}`,
      title: loc.name
    });
    markers.push(marker);
  });
  renderLocationList();
  document.getElementById('locations-json').value = JSON.stringify(locations);
}

document.addEventListener("DOMContentLoaded", initMap);

document.getElementById('itinerary-form').addEventListener('submit', function(event) {
  const title = document.querySelector('[name="title"]').value;
  const startDate = document.querySelector('[name="start_date"]').value;
  const endDate = document.querySelector('[name="end_date"]').value;
  if (!title || !startDate || !endDate || locations.length === 0) {
    alert("Please complete all fields and add at least one location.");
    event.preventDefault();
  }
});
</script>

{% endblock %}
