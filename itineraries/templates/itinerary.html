{% extends "base.html" %}

{% block title %}View Itinerary{% endblock %}

{% block content %}
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    margin: 0;
    padding: 0;
  }

  h2 {
    font-size: 2rem;
    color: #333;
    text-align: center;
    margin-top: 20px;
  }

  .chat-button {
    position: absolute;
    top: 20px;
    left: 20px;
    padding: 10px 20px;
    background-color: #0084ff;
    color: white;
    border-radius: 5px;
    text-decoration: none;
    font-size: 16px;
  }

  .chat-button:hover {
    background-color: #005bb5;
  }

  p {
    font-size: 1.1rem;
    color: #555;
    text-align: center;
  }

  .itinerary-container {
    display: flex;
    flex-wrap: wrap;
    gap: 1.5rem;
    margin-top: 20px;
    justify-content: center;
  }

  .map-section {
    flex: 2;
    min-width: 600px;
    max-width: 800px;
  }

  .itinerary-detail-container {
    background-color: white;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
    flex: 1;
    min-width: 320px;
    max-width: 500px;
    height: fit-content;
    position: relative;
  }

  #map {
    width: 100%;
    height: 400px;
    border-radius: 8px;
  }

  .scroll-box {
    max-height: 300px;
    overflow-y: auto;
    border: 1px solid #ccc;
    padding: 0.5rem;
    border-radius: 5px;
    background-color: #fafafa;
  }

  @media (max-width: 768px) {
    .itinerary-container {
      flex-direction: column;
      align-items: center;
    }

    .map-section {
      min-width: 100%;
      height: 400px;
    }

    .itinerary-detail-container {
      max-width: 100%;
      padding: 15px;
    }

    .scroll-box {
      max-height: 250px;
    }
  }
</style>

<div style="position: relative;">
  <a href="{% url 'room' slug=itinerary.chat_room.slug %}" class="chat-button">
    Chat
  </a>
</div>

<h2>{{ itinerary.name }}</h2>
<p><strong>Start Date:</strong> {{ itinerary.start_date }} | <strong>End Date:</strong> {{ itinerary.end_date }}</p>

<div class="itinerary-container">
  <div class="map-section">
    <div id="map"></div>
  </div>

  <div class="itinerary-detail-container">
    <h3>Locations</h3>
    <div class="scroll-box">
      <ul id="location-list"></ul>
    </div>
  </div>
</div>

{% if is_owner %}
<div class="top-buttons">
  <a href="{% url 'edit_itinerary' itinerary.id %}" class="btn-edit">Edit</a>
  <form action="{% url 'delete_itinerary' itinerary.id %}" method="POST" style="display:inline;">
    {% csrf_token %}
    <button type="submit" class="btn-delete" onclick="return confirm('Are you sure you want to delete this itinerary?');">Delete</button>
  </form>
</div>
{% endif %}

<script src="https://maps.googleapis.com/maps/api/js?key={{ GOOGLE_MAPS_API_KEY }}&libraries=places"></script>

<script>
let locations = JSON.parse('{{ locations|escapejs }}');
let map;
let markers = [];

function initMap() {
    if (!locations || locations.length === 0) {
        alert('No locations found for this itinerary.');
        return;
    }

    map = new google.maps.Map(document.getElementById('map'), {
        center: { lat: locations[0].latitude, lng: locations[0].longitude },
        zoom: 6,
    });

    const bounds = new google.maps.LatLngBounds();
    const placesService = new google.maps.places.PlacesService(map);
    const geocoder = new google.maps.Geocoder();

    locations.forEach((loc, idx) => {
        if (loc.latitude && loc.longitude) {
            const position = { lat: loc.latitude, lng: loc.longitude };
            const marker = new google.maps.Marker({
                map: map,
                position: position,
                label: `${idx + 1}`,
                title: loc.name,
            });

            markers.push(marker);
            bounds.extend(position);
        }
    });

    map.fitBounds(bounds);
    renderLocationList();
}

function renderLocationList() {
    const list = document.getElementById('location-list');
    list.innerHTML = '';

    locations.forEach((loc, idx) => {
        const li = document.createElement('li');
        li.innerHTML = `
            <strong>${idx + 1}. ${loc.name}</strong><br>
            ${loc.address}<br>
            <em>${loc.visit_date}</em><br>
            Notes: ${loc.notes || 'No notes'}
        `;
        list.appendChild(li);
    });
}

document.addEventListener("DOMContentLoaded", initMap);
</script>

{% endblock %}
