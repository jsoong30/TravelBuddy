{% extends "base.html" %}

{% block title %}Sign Up | Travel Buddy{% endblock %}

{% block content %}
<div class="auth-container">
    <h1>Sign Up</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="auth-button">Sign Up</button>
    </form>
    <div class="auth-links">
        <p>Already have an account? <a href="{% url 'login' %}">Login</a></p>
    </div>
</div>
{% endblock %}
