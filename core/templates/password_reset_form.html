{% extends "base.html" %}
{% block title %}Reset Your Password{% endblock %}

{% block content %}
  <div style="max-width:400px;margin:2rem auto;text-align:center;">
    <h2>Reset your password</h2>
    <form method="post">
      {% csrf_token %}
      {{ form.email.label_tag }}<br>
      {{ form.email }}<br><br>
      <button type="submit"
              style="padding:10px 20px;background:orange;color:#fff;border:none;border-radius:4px;">
        Send reset link
      </button>
    </form>
  </div>
{% endblock %}
